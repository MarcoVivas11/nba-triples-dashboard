name: Actualizar Base NBA Triples

on:
  workflow_dispatch:
  schedule:
    # Corre todos los dias a las 21:00 UTC (5:00 PM hora local)
    - cron: '0 21 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script principal
        run: python triples_nba.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html nba_2026_27_datos.json nba_2026_27_triples.csv
          git commit -m "Actualizacion diaria NBA" || exit 0
          git push
