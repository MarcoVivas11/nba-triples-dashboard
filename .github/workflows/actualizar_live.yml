name: Actualizar Live NBA Triples

on:
  workflow_dispatch:
  schedule:
    # Corre cada 15 min entre 23:00 UTC y 06:59 UTC (7:00 PM a 2:59 AM hora local)
    - cron: '*/15 23,0,1,2,3,4,5,6 * * *'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar partidos en vivo y estadisticas
        run: python nba_live_ahora.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nba_live.json
          if [ -f nba_puntos.json ]; then git add nba_puntos.json; fi
          if [ -f nba_triples.json ]; then git add nba_triples.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios en los JSON para commitear."
            exit 0
          fi
          git commit -m "Sync live NBA"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
